<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">tokgo — record a TikTok live stream to mp4</title>
  <desc id="heroDesc">The tokgo wordmark beside a terminal session that waits for a live room, records it, remuxes the segments, and reports the finished mp4.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="400" fill="#08090b"/>

  <!-- title block -->
  <g id="title-block">
    <text class="mono" x="56" y="72" font-size="17" letter-spacing="3.2" fill="#25f4ee">TIKTOK LIVE → MP4</text>

    <text class="mono" x="56" y="188" font-size="100" font-weight="700" fill="#e6e8eb">tokgo</text>
    <text class="mono" x="378" y="188" font-size="20" fill="#8a909a">v0.2.0</text>

    <text class="sans" x="56" y="244" font-size="27" fill="#e6e8eb">Waits for the stream,</text>
    <text class="sans" x="56" y="282" font-size="27" fill="#e6e8eb">records it, remuxes to mp4.</text>

    <text class="mono" x="56" y="340" font-size="17" fill="#8a909a">Go binary · ffmpeg copy · MIT</text>
  </g>

  <!-- capture session -->
  <g id="project-proof" transform="translate(520 42)">
    <rect x="0" y="0" width="624" height="316" rx="16" fill="#0e1116" stroke="#242a33"/>

    <circle cx="24" cy="21" r="4" fill="#2a3038"/>
    <circle cx="42" cy="21" r="4" fill="#2a3038"/>
    <circle cx="60" cy="21" r="4" fill="#2a3038"/>
    <text class="mono" x="84" y="27" font-size="16" fill="#8a909a">tokgo -u skynews -once -duration 1</text>

    <line x1="0" y1="42" x2="624" y2="42" stroke="#242a33"/>

    <g class="mono" font-size="19">
      <text x="24" y="76" fill="#e6e8eb"><tspan fill="#25f4ee">[INFO]  </tspan>@skynews · LIVE · up 24:06</text>
      <text x="24" y="108" fill="#e6e8eb"><tspan fill="#25f4ee">[INFO]  </tspan>title "Your budget questions answered"</text>
      <text x="24" y="140" fill="#e6e8eb"><tspan fill="#25f4ee" font-weight="700">[START] </tspan>skynews=20261029_202458</text>
      <text x="24" y="172" fill="#e6e8eb"><tspan fill="#25f4ee">⠧ </tspan>recording.. <tspan fill="#9aa0aa">(58s / cap 1min)</tspan></text>
      <text x="24" y="204" fill="#e6e8eb"><tspan fill="#ffd166" font-weight="700">[STOP]  </tspan>duration cap reached · 1min</text>
      <text x="24" y="236" fill="#e6e8eb"><tspan fill="#25f4ee">⠋ </tspan>remuxing..</text>
      <text x="24" y="268" fill="#e6e8eb"><tspan fill="#3ddc84" font-weight="700">[DONE]  </tspan>skynews=20261029_202458.mp4</text>
    </g>
  </g>
</svg>
